name: 打包AI影

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 校验 MPV 原生资产
        run: |
          chmod +x scripts/verify_mpv_native_assets.sh
          bash scripts/verify_mpv_native_assets.sh --require-elf

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android 组件
        run: |
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: 还原 release 签名 (固定 keystore, 保证可覆盖安装)
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -e
          mkdir -p release
          echo "$ANDROID_KEYSTORE" | base64 -d > release/aiying.keystore
          test -s release/aiying.keystore || { echo "keystore 还原失败: 空文件"; exit 1; }
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          storeFile=$GITHUB_WORKSPACE/release/aiying.keystore
          keyAlias=$ANDROID_KEY_ALIAS
          storePassword=$ANDROID_KEYSTORE_PASS
          keyPassword=$ANDROID_KEYSTORE_PASS
          EOF
          ls -l release/aiying.keystore
          echo "=== local.properties ==="
          cat local.properties

      - name: 构建手机版 release 包
        env:
          WEBHTV_RELEASE_TAG: "dev"
          WEBHTV_APK_SUFFIX: ""
        run: |
          chmod +x ./gradlew
          rm -rf Release/apk
          ./gradlew \
            :app:assembleMobileArm64_v8aRelease \
            :app:assembleMobileArmeabi_v7aRelease \
            -PfastRelease=true \
            --no-daemon

      - name: 收集产物
        run: |
          rm -rf dist
          mkdir -p dist
          cp Release/apk/*.apk dist/
          ls -lh dist/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ai影
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
